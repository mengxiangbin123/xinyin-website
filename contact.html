<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>联系我们 | 心音科技 - 预约体验与咨询</title>
  <meta name="description" content="预约心声环体验、产品咨询、商务合作或媒体联系，请通过心音科技官网联系我们。">
  <link rel="canonical" href="https://mindheart.health/contact.html">

  <meta property="og:type" content="website">
  <meta property="og:title" content="联系我们 | 心音科技">
  <meta property="og:url" content="https://mindheart.health/contact.html">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo" aria-label="心音科技 首页">心音科技</a>
      <nav class="nav" aria-label="主导航">
        <a href="product.html">产品</a>
        <a href="science.html">科学与临床</a>
        <a href="index.html#app">App</a>
        <a href="index.html#faq">常见问题</a>
        <a href="contact.html">联系我们</a>
      </nav>
      <a href="contact.html" class="btn btn-primary">预约体验</a>
      <button type="button" class="menu-toggle" aria-label="打开菜单" aria-expanded="false"></button>
    </div>
  </header>

  <main>
    <section class="page-hero">
      <div class="container">
        <p class="hero-label">心音科技</p>
        <h1 class="page-title">联系我们</h1>
        <p class="page-lead">预约心声环体验、产品咨询、商务合作或媒体联系，请填写下方表单，我们会尽快与您联系。</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="contact-layout">
          <div class="contact-form-wrap">
            <h2>预约 / 咨询表单</h2>
            <form class="contact-form" action="#" method="post" aria-label="预约咨询表单">
              <div class="form-row">
                <label for="c-name">姓名 <span class="required">*</span></label>
                <input type="text" id="c-name" name="name" placeholder="您的姓名" required>
              </div>
              <div class="form-row">
                <label for="c-phone">手机号 <span class="required">*</span></label>
                <input type="tel" id="c-phone" name="phone" placeholder="手机号" required>
              </div>
              <div class="form-row">
                <label for="c-email">邮箱</label>
                <input type="email" id="c-email" name="email" placeholder="选填">
              </div>
              <div class="form-row">
                <label for="c-type">咨询类型</label>
                <select id="c-type" name="type" aria-label="咨询类型">
                  <option value="trial">预约体验</option>
                  <option value="purchase">产品购买</option>
                  <option value="b2b">商务合作</option>
                  <option value="media">媒体联系</option>
                  <option value="other">其他</option>
                </select>
              </div>
              <div class="form-row">
                <label for="c-message">留言</label>
                <textarea id="c-message" name="message" placeholder="请简要说明您的需求（选填）" rows="4"></textarea>
              </div>
              <button type="submit" class="btn btn-primary btn-lg">提交</button>
            </form>
          </div>
          <aside class="contact-info">
            <h2>其他方式</h2>
            <p>您也可以通过以下方式与我们取得联系：</p>
            <ul class="contact-meta">
              <li>官网：本网站</li>
              <li>后续将公布客服邮箱、热线及办公地址，请以届时官网或产品包装说明为准。</li>
            </ul>
            <p class="contact-note">我们会在 1–3 个工作日内回复您的预约或咨询请求。</p>
          </aside>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <a href="index.html" class="logo">心音科技</a>
        <p>心音+心电，听懂心脏。居家心脏健康监测入口。</p>
      </div>
      <div class="footer-links">
        <a href="product.html">产品</a>
        <a href="science.html">科学与临床</a>
        <a href="index.html#app">App</a>
        <a href="index.html#faq">常见问题</a>
        <a href="contact.html">联系我们</a>
      </div>
      <div class="footer-legal">
        <a href="privacy.html">隐私政策</a>
        <a href="terms.html">服务条款</a>
      </div>
      <p class="footer-copy">© <span id="year"></span> 心音科技 版权所有</p>
    </div>
  </footer>

  <script src="main.js"></script>
  <script>
    (function () {
      var form = document.querySelector('.contact-form');
      if (form) {
        form.addEventListener('submit', function (e) {
          e.preventDefault();
          var name = document.getElementById('c-name');
          var phone = document.getElementById('c-phone');
          if (name && name.value && phone && phone.value) {
            alert('感谢您的提交！我们会尽快与您联系。');
            form.reset();
          }
        });
      }
    })();
  </script>
</body>
</html>
